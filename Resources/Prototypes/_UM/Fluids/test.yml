- type: entity
  id: FluidTestOverlay
  suffix: FLUID
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    noRot: true
    anchored: true
  - type: Sprite
    noRot: true
    layers:
    - sprite: _UM/Fluid/fluid.rsi
      state: overlay_2
    drawdepth: Overlays
    color: "#75b1f0BF"

- type: entity
  name: fluid
  id: FluidPuddle
  description: A body of liquid.
  suffix: FLUID
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Clickable
  - type: Solution
  - type: DrawableSolution
    solution: whatever
  - type: Transform
    noRot: true
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        layer:
        - SlipLayer
        mask:
        - ItemMask
        density: 1000
        hard: false
  - type: IconSmooth
    key: puddles
    base: splat
    mode: CardinalFlags
  - type: Appearance
  - type: Sprite
    noRot: true
    layers:
    - sprite: _UM/Fluid/fluid.rsi
      state: splat0
      map: [ "enum.FluidColorVisuals.Color" ]
      color: "#75b1f0d0"
    drawdepth: Puddles
  - type: TileFluidVisuals
  - type: TileFluid
