- type: entity
  id: FluidSource
  name: Fluid Source 1000
  description: fluiid
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: Objects/Specific/Detective/evidence_marker.rsi
  - type: FluidSource
    solution:
      reagents:
      - ReagentId: Water
        Quantity: 1000
  - type: TimedDespawn
    lifetime: 5

