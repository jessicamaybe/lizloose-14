- type: entity
  id: FluidPool
  name: Fluid Pool
  components:
  - type: Sprite
    noRot: true
    sprite: Effects/fire_greyscale.rsi
    layers:
    - state: 2
      color: "#FF00FFFF"
  - type: FluidPool
    overflowVolume: 50
    solutionName: pool
  - type: MixableSolution
    solution: pool
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 100000000


